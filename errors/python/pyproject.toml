[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atempo-errors"
version = "0.1.0"
description = "Clases de error y fábrica de errores por catálogo"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["atempo_errors*"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
extraPaths = ["."]
