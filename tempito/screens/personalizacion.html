<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personalización — Tempito</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <p class="brand">Tempito</p>
        <p class="level-pill">Nivel 3</p>
        <a class="profile" href="personalizacion.html" aria-current="page">Perfil</a>
      </header>

      <section class="hero">
        <div>
          <p class="kicker">Personalización</p>
          <h1>El armario de Lucía</h1>
          <p class="lead">
            Pulsa un objeto desbloqueado para ponérselo o quitárselo. Mochila y
            bosque siguen bloqueados.
          </p>
        </div>
        <div class="mascot-stage compact wears-glasses" data-mascot-stage>
          <img
            src="../assets/mascot/tempito.jpg"
            alt="Tempito, mascota turquesa con dos hojitas"
            data-expression="curious"
          />
          <span class="wear wear-hat"></span>
          <span class="wear wear-glasses"></span>
          <span class="wear wear-scarf"></span>
        </div>
      </section>

      <section class="card">
        <h2>Inventario</h2>
        <p class="muted">Prototipo: se ve puesto, no se guarda.</p>
        <div class="inventory">
          <button class="item is-equipped" type="button" data-item="glasses">
            <div class="dot glasses"></div>
            Gafas
          </button>
          <button class="item" type="button" data-item="hat">
            <div class="dot hat"></div>
            Sombrero
          </button>
          <button class="item" type="button" data-item="scarf">
            <div class="dot scarf"></div>
            Bufanda
          </button>
          <button class="item locked" type="button" data-item="bag" disabled>
            <div class="dot bag"></div>
            Mochila
          </button>
          <button class="item locked" type="button" data-item="forest" disabled>
            <div class="dot forest"></div>
            Bosque
          </button>
        </div>
      </section>
    </div>

    <nav class="nav" aria-label="Pantallas de Tempito">
      <a href="inicio.html">Inicio</a>
      <a href="evolucion.html">Evolución</a>
      <a href="misiones.html">Misiones</a>
      <a class="is-active" href="personalizacion.html">Personalización</a>
    </nav>
    <script src="../inventory.js"></script>
  </body>
</html>
