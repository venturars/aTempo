[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atempo-python"
version = "0.1.0"
description = "SDK Python de aTempo: session y attendance en SQLite"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy==2.0.44",
]

[tool.setuptools.packages.find]
include = ["python_domain*"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
extraPaths = ["."]
