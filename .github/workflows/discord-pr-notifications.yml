name: Discord PR notifications

on:
  pull_request_target:
    branches: [staging]
    types: [opened, review_requested, ready_for_review]
  issue_comment:
    types: [created, edited]

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'venturars/aTempo' &&
      (
        (github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'staging') ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/discord-map '))
      )
    runs-on: ubuntu-latest
    environment: Discord-PR-Notifications
    concurrency:
      group: discord-pr-relations
      queue: max
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      # Ejecuta solo la acción fijada del paquete; nunca descarga código de la PR.
      - uses: venturars/delivery-workflow/.github/actions/discord-pr-notifications@1fe1b22af187e0afa1470f9d5df435f7a202435b
        with:
          github-token: ${{ github.token }}
          bot-token: ${{ secrets.DISCORD_BOT_TOKEN }}
          cache-key: ${{ secrets.DISCORD_CACHE_KEY }}
          guild-id: ${{ vars.DISCORD_GUILD_ID }}
          channel-id: ${{ vars.DISCORD_GIT_CHANNEL_ID }}
          expected-repository: venturars/aTempo
          base-branch: staging
          trusted-branch: main
          pr-number: ${{ github.event.pull_request.number || github.event.issue.number }}
