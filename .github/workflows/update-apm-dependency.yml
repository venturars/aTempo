name: "APM: update dependency"

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Actualizar dependencia APM
    if: github.repository == 'venturars/aTempo'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: staging

      - name: Validar las entradas
        env:
          DEPENDENCY_REPO: venturars/delivery-workflow
          BASE_BRANCH: staging
        run: |
          [[ "$DEPENDENCY_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo "dependency_repo debe tener el formato organizacion/repositorio." >&2
            exit 1
          }
          git check-ref-format --branch "$BASE_BRANCH" >/dev/null 2>&1 || {
            echo "base_branch no es una rama válida." >&2
            exit 1
          }

      - name: Instalar APM
        run: |
          curl -sSL https://aka.ms/apm-unix | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Obtener la última release estable
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY_REPO: venturars/delivery-workflow
        run: |
          releases=$(gh api \
            --paginate \
            --slurp \
            "repos/$DEPENDENCY_REPO/releases?per_page=100")
          tag=$(jq -r '
            [
              .[]
              | if type == "array" then .[] else . end
              | select(
                  (if has("draft") then .draft else .isDraft end) == false
                  and (if has("prerelease") then .prerelease else .isPrerelease end) == false
                )
              | select(
                  (if has("tag_name") then .tag_name else .tagName end)
                  | test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")
                )
            ]
            | sort_by(
                (if has("tag_name") then .tag_name else .tagName end)
                | ltrimstr("v")
                | split(".")
                | map([length, .])
              )
            | last
            | .tag_name // .tagName // empty
          ' <<<"$releases")
          [[ -n "$tag" ]] || {
            echo "No hay ninguna GitHub Release estable válida con tag vX.Y.Z para $DEPENDENCY_REPO." >&2
            exit 1
          }
          echo "ref=$tag" >>"$GITHUB_OUTPUT"
          echo "Última release estable: $tag"

      - name: Actualizar la dependencia y regenerar los archivos de APM
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY_REPO: venturars/delivery-workflow
          REF: ${{ steps.release.outputs.ref }}
        run: |
          actual=$(python3 .github/scripts/self-release.py pin "$DEPENDENCY_REPO")
          if [[ "$actual" == "${DEPENDENCY_REPO}#${REF}" ]]; then
            echo "dependencies.apm ya apunta a ${REF}."
            exit 0
          fi
          python3 .github/scripts/self-release.py set "$DEPENDENCY_REPO" "$REF"
          # Si el apm.yml de la release pinnea otra etiqueta del mismo paquete, APM no
          # puede instalar los dos commits. Entonces solo se escribe el pin y no se ejecuta apm update.
          nested=$(python3 .github/scripts/self-release.py nested "$DEPENDENCY_REPO" "$REF")
          echo "nested=${nested}" >>"$GITHUB_OUTPUT"
          if [[ -n "$nested" ]]; then
            echo "$REF pinnea $nested. Se escribe solo el pin y no se ejecuta apm update."
            exit 0
          fi
          # --force: el runner no tiene recibos de despliegue y el paquete local
          # comparte esos ficheros con la dependencia. Sin esto, APM rechaza la escritura.
          for TARGET in claude cursor codex; do
            apm update "$DEPENDENCY_REPO" --target "$TARGET" --yes --force
          done

      - name: Crear o actualizar la PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: chore/update-delivery-workflow
          base: staging
          draft: true
          delete-branch: true
          commit-message: "chore: update venturars/delivery-workflow to ${{ steps.release.outputs.ref }}"
          title: "Update delivery-workflow to ${{ steps.release.outputs.ref }}"
          body: |
            Actualiza `venturars/delivery-workflow` a `${{ steps.release.outputs.ref }}`.

            Incluye `apm.yml`, `apm.lock.yaml` y los archivos generados por APM.
            ${{ steps.update.outputs.nested != '' && format('Aviso: `{0}` pinnea otra etiqueta del mismo paquete. Solo se ha escrito el pin en `apm.yml`; `apm.lock.yaml` y los archivos generados siguen en la versión anterior hasta que se publique una release sin esa autodependencia.', steps.update.outputs.nested) || '' }}
