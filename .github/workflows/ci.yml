# Comprueba cada pull request a staging: lint y tipos de desktop/, y el build de Storybook.
# Cada paso solo se lanza si el anterior pasó. Si uno falla, la pull request queda en rojo.
name: CI

on:
  pull_request:
    branches: [staging]

# Solo lee el repositorio
permissions:
  contents: read

# Un push nuevo a la misma pull request cancela la comprobación anterior
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      # pnpm sale de packageManager en desktop/package.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json

      # Node 24.22.3, el mismo que el Dockerfile
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  storybook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/storybook
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/storybook/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: pnpm
          cache-dependency-path: docs/storybook/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook
