# Comprueba cada pull request a staging. Cada carpeta con un pnpm-lock.yaml es un paquete:
# se comprueban los que la pull request cambia (todos si cambia algo compartido) con lint,
# typecheck y build-storybook, si el paquete tiene el script.
# La única comprobación obligatoria es «CI / ci»: falla si algún paquete falla.
name: CI

on:
  pull_request:
    branches: [staging]

# Solo lee el repositorio
permissions:
  contents: read

# Un push nuevo a la misma pull request cancela la comprobación anterior
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t all < <(git ls-files -- '*pnpm-lock.yaml' | xargs -rn1 dirname | grep -vx '.' | sort -u)
          changed=$(git diff --name-only "$BASE_SHA" HEAD)

          # Lo compartido (workflows, imagen de Docker) puede romper cualquier paquete
          if grep -qE '^(\.github/|Dockerfile$|docker-compose\.yml$)' <<<"$changed"; then
            selected=("${all[@]}")
          else
            selected=()
            for package in "${all[@]}"; do
              while IFS= read -r file; do
                if [[ $file == "$package/"* ]]; then
                  selected+=("$package")
                  break
                fi
              done <<<"$changed"
            done
          fi

          packages=$(printf '%s\n' "${selected[@]}" | jq -Rc 'select(length > 0)' | jq -sc .)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Paquetes: ${all[*]}. Se comprueban: $packages" >> "$GITHUB_STEP_SUMMARY"

  # Sin «name»: GitHub lo llama «check (<paquete>)», y solo «check» si se salta
  check:
    needs: plan
    if: needs.plan.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      # Un paquete en rojo no detiene a los demás
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      # pnpm sale de packageManager en el package.json del paquete
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ matrix.package }}/package.json

      # Node 24.22.3, el mismo que el Dockerfile
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: pnpm
          cache-dependency-path: ${{ matrix.package }}/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      # --if-present: si el paquete no tiene el script, el paso no hace nada
      - run: pnpm run --if-present lint
      - run: pnpm run --if-present typecheck
      - run: pnpm run --if-present build-storybook
      # Solo node-domain: el `test` de las APIs es e2e y el de blockend es Hardhat
      - if: matrix.package == 'domain/node-domain'
        run: pnpm test

  # La comprobación obligatoria. Pasa si no había paquetes que comprobar.
  ci:
    needs: [plan, check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          if [[ " $RESULTS " == *" failure "* || " $RESULTS " == *" cancelled "* ]]; then
            exit 1
          fi
