name: Snapshot Debian

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  comprobar-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          persist-credentials: false

      - name: Comprobar la fecha del snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Update the pinned Debian snapshot
        run: |
          snapshot="$(sed -n 's/^ARG DEBIAN_SNAPSHOT=\([0-9]\{8\}\)T.*/\1/p' Dockerfile)"
          if [ -z "$snapshot" ]; then
            echo "::error file=Dockerfile::No se encuentra ARG DEBIAN_SNAPSHOT=AAAAMMDDThhmmssZ"
            exit 1
          fi
          age=$(( ( $(date -u +%s) - $(date -u -d "$snapshot" +%s) ) / 86400 ))
          echo "DEBIAN_SNAPSHOT tiene $age días."
          if [ "$age" -le 30 ]; then
            exit 0
          fi
          open="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --limit 100 --json title --jq '[.[] | select(.title == env.TITLE)] | length')"
          if [ "$open" -gt 0 ]; then
            echo "Ya hay una issue abierta."
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label chore --body "$(printf '%s\n' \
            "## Qué hay que hacer" \
            "" \
            "Subir \`DEBIAN_SNAPSHOT\` del \`Dockerfile\`, hoy del $snapshot ($age días), a una fecha reciente, y a la vez las versiones fijadas de las dos etapas. El porqué está en \`docs/ARCHITECTURE.md\` (entorno de instalación)." \
            "" \
            "## Qué sigue igual" \
            "" \
            "Los paquetes instalados y los servicios de Compose: solo cambian las versiones de Debian." \
            "" \
            "## Cómo probarlo" \
            "" \
            "1. \`docker compose build setup\` construye la imagen." \
            "2. \`docker compose --profile gui build desktop-gui\` construye la imagen gráfica." \
            "3. \`docker compose run --rm setup\` instala el proyecto.")"
