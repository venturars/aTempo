# Entorno de instalación de aTempo. El porqué está en docs/ARCHITECTURE.md.
#   docker compose run --rm setup               instala APM y las dependencias
#   docker compose up storybook                 sirve Storybook en http://localhost:6006
#   docker compose run --rm desktop pnpm lint   comprueba desktop/ con las versiones del equipo
#   docker compose up api-router                Nest en http://localhost:3000 (Swagger en /docs)
#   docker compose up api-postgresql api-sqlite api-rustfs  APIs en http://localhost:3001–3003
#   docker compose up desktop-gui               abre la ventana de Electron (opcional, ver el README)

x-base: &base
  build:
    context: .
    target: base
  image: atempo-dev

services:
  setup:
    <<: *base
    command: bash docker/setup.sh
    volumes:
      - .:/work
      - desktop-node-modules:/work/desktop/node_modules
      - storybook-node-modules:/work/docs/storybook/node_modules
      - api-router-node-modules:/work/api-router/node_modules
      - api-postgresql-node-modules:/work/api-postgresql/node_modules
      - api-rustfs-node-modules:/work/api-rustfs/node_modules
      - api-sqlite-venv:/work/api-sqlite/.venv
      - pnpm-store:/pnpm-store

  storybook:
    <<: *base
    working_dir: /work/docs/storybook
    command: pnpm storybook --host 0.0.0.0 --ci
    ports:
      - "6006:6006"
    volumes:
      - .:/work
      - storybook-node-modules:/work/docs/storybook/node_modules
      - pnpm-store:/pnpm-store

  api-router:
    <<: *base
    working_dir: /work/api-router
    command: pnpm dev
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./api-router:/work/api-router
      - api-router-node-modules:/work/api-router/node_modules
      - pnpm-store:/pnpm-store

  postgres:
    # La base solo está expuesta a servicios dentro de la red de Compose.
    image: postgres:17.12-trixie
    environment:
      POSTGRES_DB: atempo
      POSTGRES_USER: atempo
      POSTGRES_PASSWORD: ${ATEMPO_POSTGRES_PASSWORD:?Define ATEMPO_POSTGRES_PASSWORD before starting Compose}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api-postgresql:
    <<: *base
    working_dir: /work/api-postgresql
    command: pnpm dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DATABASE_URL: postgres://atempo:${ATEMPO_POSTGRES_PASSWORD:?Define ATEMPO_POSTGRES_PASSWORD before starting Compose}@postgres:5432/atempo
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./api-postgresql:/work/api-postgresql
      - api-postgresql-node-modules:/work/api-postgresql/node_modules
      - pnpm-store:/pnpm-store

  api-sqlite:
    <<: *base
    working_dir: /work/api-sqlite
    command: /work/api-sqlite/.venv/bin/python -m flask --app api_sqlite.app:create_app run --host 0.0.0.0 --port 3002
    ports:
      - "3002:3002"
    environment:
      PORT: "3002"
      SQLITE_DATABASE_URL: sqlite:////var/lib/atempo/api-sqlite.sqlite
    volumes:
      - ./api-sqlite:/work/api-sqlite
      - api-sqlite-venv:/work/api-sqlite/.venv
      - api-sqlite-data:/var/lib/atempo

  rustfs:
    # El almacén conserva los objetos en su propio volumen Docker.
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: devadmin
      RUSTFS_SECRET_KEY: devsecret
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  api-rustfs:
    <<: *base
    working_dir: /work/api-rustfs
    command: pnpm dev
    depends_on:
      rustfs:
        condition: service_healthy
    ports:
      - "3003:3003"
    environment:
      PORT: "3003"
      RUSTFS_ENDPOINT: rustfs
      RUSTFS_PORT: "9000"
      RUSTFS_USE_SSL: "false"
      RUSTFS_ACCESS_KEY: devadmin
      RUSTFS_SECRET_KEY: devsecret
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./api-rustfs:/work/api-rustfs
      - api-rustfs-node-modules:/work/api-rustfs/node_modules
      - pnpm-store:/pnpm-store

  desktop:
    <<: *base
    working_dir: /work/desktop
    volumes:
      - .:/work
      - desktop-node-modules:/work/desktop/node_modules
      - pnpm-store:/pnpm-store

  # Opcional: construye y abre la app en la pantalla del ordenador, a través de su servidor X11.
  # En macOS, XQuartz. DISPLAY se puede cambiar con ATEMPO_DISPLAY para Linux o Windows.
  desktop-gui:
    # Con un perfil, docker compose up sin nombre de servicio no lo arranca.
    profiles: [gui]
    build:
      context: .
      target: desktop-gui
    image: atempo-dev-gui
    working_dir: /work/desktop
    # pnpm start es electron-vite preview: construye la app y la abre en Electron. Los flags van a Electron.
    command: pnpm run start -- --no-sandbox --disable-gpu
    environment:
      DISPLAY: ${ATEMPO_DISPLAY:-host.docker.internal:0}
    # Chromium necesita más memoria compartida que los 64 MB de Docker para pintar la ventana.
    shm_size: 1gb
    volumes:
      - .:/work
      - desktop-node-modules:/work/desktop/node_modules
      - pnpm-store:/pnpm-store

# Cada API conserva sus dependencias y datos Linux en volúmenes separados.

# Cada proyecto tiene sus node_modules: desktop/, docs/storybook/ y api-router/ tienen cada uno su lockfile.
# pnpm-store es la caché de pnpm y sí se comparte.
# Docker les pone delante el nombre de la carpeta: cada copia del repositorio tiene los suyos.
volumes:
  desktop-node-modules:
  storybook-node-modules:
  api-router-node-modules:
  api-postgresql-node-modules:
  api-rustfs-node-modules:
  api-sqlite-venv:
  pnpm-store:
  postgres-data:
  api-sqlite-data:
  rustfs-data:
